<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>科技智能硬件公司官网</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:"Microsoft Yahei",sans-serif;color:#333;}

    /* 导航栏 */
    .header{width:100%;height:70px;background:#fff;box-shadow:0 0 8px #eee;position:sticky;top:0;z-index:99;}
    .nav-wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;height:100%;padding:0 20px;}
    .logo{font-size:24px;font-weight:bold;color:#0066cc;}
    .nav-menu a{margin:0 15px;color:#333;text-decoration:none;}
    .nav-menu a:hover{color:#0066cc;}

    /* 移动端汉堡菜单 */
    .menu-icon{display:none;font-size:26px;cursor:pointer;}
    .mobile-menu{display:none;position:absolute;top:70px;left:0;width:100%;background:#fff;box-shadow:0 4px 8px #eee;}
    .mobile-menu a{display:block;padding:12px 20px;text-decoration:none;color:#333;}

    /* Banner */
    .banner{width:100%;height:500px;background:linear-gradient(rgba(0,50,120,.6),rgba(0,50,120,.6)),
    url('https://picsum.photos/1920/1080') center no-repeat;background-size:cover;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;}
    .banner h1{font-size:48px;margin-bottom:16px;}
    .banner p{font-size:18px;margin-bottom:24px;}
    .banner button{padding:12px 30px;border:none;background:#0066cc;color:#fff;border-radius:6px;cursor:pointer;}

    /* 产品板块 */
    .section{max-width:1200px;margin:80px auto;padding:0 20px;}
    .title{text-align:center;font-size:32px;color:#0066cc;margin-bottom:40px;}
    .product-list{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;}
    .product-card{border:1px solid #eee;border-radius:8px;overflow:hidden;transition:all .3s;}
    .product-card:hover{transform:translateY(-8px);box-shadow:0 8px 20px #eee;}
    .product-card img{width:100%;height:220px;object-fit:cover;}
    .product-card .txt{padding:20px;}
    .product-card h3{margin-bottom:10px;}

    /* 页脚 */
    .footer{background:#002244;color:#fff;text-align:center;padding:40px 0;margin-top:60px;}

    /* 自适应 */
    @media (max-width:768px){
      .nav-menu{display:none;}
      .menu-icon{display:block;}
      .banner h1{font-size:28px;}
      .banner{height:320px;}
      .product-list{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 导航 -->
    <header class="header">
      <div class="nav-wrap">
        <div class="logo">智能硬件科技</div>
        <nav class="nav-menu">
          <a href="#">首页</a>
          <a href="#">产品中心</a>
          <a href="#">技术方案</a>
          <a href="#">新闻资讯</a>
          <a href="#">联系我们</a>
        </nav>
        <div class="menu-icon" @click="showMenu = !showMenu">☰</div>
      </div>
      <div class="mobile-menu" v-if="showMenu">
        <a href="#">首页</a>
        <a href="#">产品中心</a>
        <a href="#">技术方案</a>
        <a href="#">新闻资讯</a>
        <a href="#">联系我们</a>
      </div>
    </header>

    <!-- 轮播Banner -->
    <div class="banner">
      <h1>专注智能硬件 · 物联网技术</h1>
      <p>全屋智能 | AI芯片 | IoT模组 | 行业解决方案</p>
      <button>了解更多</button>
    </div>

    <!-- 产品展示 -->
    <div class="section">
      <h2 class="title">核心产品</h2>
      <div class="product-list">
        <div class="product-card">
          <img src="https://picsum.photos/600/400?1">
          <div class="txt">
            <h3>智能控制终端</h3>
            <p>高性能物联网智能硬件终端，稳定可靠</p>
          </div>
        </div>
        <div class="product-card">
          <img src="https://picsum.photos/600/400?2">
          <div class="txt">
            <h3>AI边缘计算芯片</h3>
            <p>低功耗高算力，适用于多类智能设备</p>
          </div>
        </div>
        <div class="product-card">
          <img src="https://picsum.photos/600/400?3">
          <div class="txt">
            <h3>全屋智能家居方案</h3>
            <p>一站式全屋智能定制，适配住宅与商用</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
      <p>© 2025 智能硬件科技公司 版权所有 | 备案号：粤ICPxxxxxx</p>
    </footer>
  </div>

  <script>
    const { createApp } = Vue
    createApp({
      data(){
        return {
          showMenu: false
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
